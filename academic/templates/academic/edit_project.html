{% extends 'academic/base.html' %}

{% block title %}Edit Project - ContriGrade{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-8">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
        <div class="flex items-center gap-3 mb-6 border-b pb-4">
            <a href="{% url 'dashboard_redirect' %}" class="text-gray-400 hover:text-blue-600 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="text-xl font-bold">Edit Project Details</h2>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            
            <div class="mt-8 flex gap-3">
                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition">
                    Save Changes
                </button>
                <a href="{% url 'dashboard_redirect' %}" class="px-6 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-lg hover:bg-gray-200 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
